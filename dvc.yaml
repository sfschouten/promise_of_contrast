  report_subspace_scatter_cities_grid_llama2_html:
    cmd: python scripts/report_subspace_scatter.py --html --runs llama2_7b__cities_grid --output-name cities_grid_llama2_subspace_scatter_3d
    deps:
      - scripts/report_subspace_scatter.py
      - src/probing/
      - src/activations/
      - data/probes/llama2_7b__cities_grid
      - data/activations/llama2_7b__cities_grid
    params:
