stages:
  generate:
    foreach: ${dataset}
    do:
      cmd: python scripts/generate_${key}.py
      deps:
        - scripts/generate_${key}.py
        - src/data/
        - ${item.data_dir}
      params:
        - dataset.${key}
      outs:
        - data/raw/${key}.jsonl

  make_pairs:
    foreach: ${families}
    do:
      cmd: python scripts/make_pairs.py --family ${key}
      deps:
        - scripts/make_pairs.py
        - src/data/
        - ${item.path}
      params:
        - families.${key}
      outs:
        - data/processed/pairs_${key}.jsonl

  preprocess:
    foreach: ${families}
    do:
      cmd: python scripts/preprocess.py --family ${key}
      deps:
        - scripts/preprocess.py
        - src/data/
        - templates/
        - data/processed/pairs_${key}.jsonl
      params:
        - preprocessing
        - families.${key}
      outs:
        - data/processed/samples_${key}.jsonl
        - data/processed/graphs_${key}.jsonl

  extract_activations:
    foreach: ${runs}
    do:
      cmd: python scripts/extract_activations.py --run ${key}
      deps:
        - scripts/extract_activations.py
        - src/activations/
        - data/processed/samples_${item.family}.jsonl
      params:
        - models.${item.model}
        - activations
        - output.activations_dir
      outs:
        - data/activations/${key}

  train_probes:
    foreach: ${runs}
    do:
      cmd: python scripts/train_probes.py --run ${key}
      deps:
        - scripts/train_probes.py
        - src/probing/
        - src/results/
        - data/processed/samples_${item.family}.jsonl
        - data/processed/graphs_${item.family}.jsonl
        - data/activations/${key}
      params:
        - models.${item.model}
        - activations
        - probing.train_split
        - probing.seed
        - probing.layers
        - probing.train_positions
        - probing.label_descriptors
        - probing.methods
        - probing_profiles
        - output.activations_dir
        - output.probes_dir
      outs:
        # persist: train_probes.py already skips probes whose config_hash is unchanged
        # (see _load_probe_cache), but DVC deletes a stage's outputs before running it,
        # which threw that cache away and re-fitted everything -- including the 7 CCS
        # variants x 30 seeds -- whenever a single method was added to the profile.
        # Keeping the directory lets the incremental path do its job.  Probes for methods
        # dropped from the profile are not carried over: the script rewrites the manifest
        # and the params file from what it fitted or deliberately reused.
        - data/probes/${key}:
            persist: true

  train_probes_compound:
    foreach: ${run_compounds}
    do:
      cmd: python scripts/train_probes.py --run-compound ${key}
      deps:
        - scripts/train_probes.py
        - src/probing/
        - src/results/
        - data/activations/${item.model}__${item.family}
      params:
        - models.${item.model}
        - activations
        - probing.train_split
        - probing.seed
        - probing.layers
        - probing.train_positions
        - probing.label_descriptors
        - probing.methods
        - output.activations_dir
        - output.probes_dir
        - compounds.${item.compound}
      outs:
        # persist: train_probes.py already skips probes whose config_hash is unchanged
        # (see _load_probe_cache), but DVC deletes a stage's outputs before running it,
        # which threw that cache away and re-fitted everything -- including the 7 CCS
        # variants x 30 seeds -- whenever a single method was added to the profile.
        # Keeping the directory lets the incremental path do its job.  Probes for methods
        # dropped from the profile are not carried over: the script rewrites the manifest
        # and the params file from what it fitted or deliberately reused.
        - data/probes/${key}:
            persist: true

  evaluate_probes:
    foreach: ${runs}
    do:
      cmd: python scripts/evaluate_probes.py --run ${key}
      deps:
        - scripts/evaluate_probes.py
        - src/probing/
        - src/results/
        - data/activations/${key}
        - data/probes/${key}
      params:
        - models.${item.model}
        - activations
        - probing.eval_positions
        - probing_profiles
        - output.activations_dir
        - output.probes_dir
        - output.eval_results_dir
      outs:
        - data/eval_results/${key}.duckdb

  evaluate_probes_compound:
    foreach: ${run_compounds}
    do:
      cmd: python scripts/evaluate_probes.py --run-compound ${key}
      deps:
        - scripts/evaluate_probes.py
        - src/probing/
        - src/results/
        - data/activations/${item.model}__${item.family}
        - data/probes/${key}
      params:
        - models.${item.model}
        - activations
        - probing.eval_positions
        - output.activations_dir
        - output.probes_dir
        - output.eval_results_dir
        - compounds.${item.compound}
      outs:
        - data/eval_results/${key}.duckdb

  merge_results:
    cmd: python scripts/merge_results.py
    deps:
      - scripts/merge_results.py
      - data/eval_results/
    params:
      - output.eval_results_dir
      - output.results_db
    outs:
      - data/results.duckdb



  report_subspace_scatter:
    cmd: python scripts/report_subspace_scatter.py
    deps:
      - scripts/report_subspace_scatter.py
      - src/probing/
      - src/activations/
      - data/probes/
      - data/activations/
    params:
      - models.llama3_8b
      - activations
      - output.activations_dir
      - output.probes_dir
      - output.reports_dir
      - reporting.yaml:
          - scatter
    outs:
      - outputs/reports/subspace_scatter.pdf:
          cache: false

  report_subspace_scatter_3d:
    cmd: python scripts/report_subspace_scatter.py --3d
    deps:
      - scripts/report_subspace_scatter.py
      - src/probing/
      - src/activations/
      - data/probes/
      - data/activations/
    params:
      - models.llama3_8b
      - activations
      - output.activations_dir
      - output.probes_dir
      - output.reports_dir
      - reporting.yaml:
