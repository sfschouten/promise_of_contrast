    deps:
      - scripts/report_subspace_scatter.py
      - src/probing/
      - src/activations/
      - data/probes/llama2_7b__cities_grid
      - data/activations/llama2_7b__cities_grid
    params:
      - models.llama2_7b
      - activations
      - output.activations_dir
      - output.probes_dir
      - output.reports_dir
      - reporting.yaml:
          - scatter
    outs:
