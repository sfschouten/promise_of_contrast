    deps:
      - scripts/report_pairs.py
      - data/processed/
    params:
      - models.llama3_8b
      - output.reports_dir
    outs:
      - outputs/reports/pairs_report_tokens.pdf:
          cache: false



  reproduce_burns_2023:
    cmd: python scripts/reproductions/burns_2023/reproduce.py
    deps:
      - scripts/reproductions/burns_2023/reproduce.py
      - src/probing/
      - src/activations/
      - data/activations/llama3_8b__ccs
      - data/probes/llama3_8b__ccs
      - data/processed/samples_ccs.jsonl
    params:
      - models.llama3_8b
      - activations.layers
      - probing.seed
      - output.reproductions_dir
    outs:
      - outputs/reproductions/burns_2023/:
          cache: false



  # Accuracy against layer, backing the paper's choice of layer 16.  Its own stage because
  # it refits probes at every cached layer (CCS with 5 seeds) and takes ~25 min per model.
  layer_sweep_promise_of_contrast:
    foreach:
      llama2_7b:
        model: llama2_7b
      llama3_8b:
        model: llama3_8b
    do:
      cmd: python scripts/reproductions/promise_of_contrast/layer_sweep.py --model ${item.model}
      deps:
        - scripts/reproductions/promise_of_contrast/layer_sweep.py
        - src/probing/
        - data/activations/${item.model}__pwl
        - data/processed/samples_pwl.jsonl
      params:
        - models.${item.model}
        - probing_profiles.pwl
        - activations.layers
      outs:
        - data/layer_sweep/${item.model}__pwl.csv

  reproduce_promise_of_contrast:
    foreach:
      llama2_7b:
        model: llama2_7b
      llama3_8b:
        model: llama3_8b
    do:
      cmd: python scripts/reproductions/promise_of_contrast/reproduce.py --model ${item.model}
      deps:
        - scripts/reproductions/promise_of_contrast/
        - src/probing/
        - src/activations/
        - data/activations/${item.model}__pwl
        - data/probes/${item.model}__pwl
        - data/eval_results/${item.model}__pwl.duckdb
        - data/processed/samples_pwl.jsonl
        # The projection figures reuse report_subspace_scatter over the tuple datasets.
        - data/probes/${item.model}__cities_grid
        - data/probes/${item.model}__days_of_week
        - data/probes/${item.model}__tot_city_tv_aff
        - data/probes/${item.model}__months_of_year
        - data/layer_sweep/${item.model}__pwl.csv
        - reporting.yaml
      params:
        - models.${item.model}
        - probing_profiles
        - output.reproductions_dir
      outs:
        - outputs/reproductions/promise_of_contrast/${item.model}/:
            cache: false

  check_paper:
    # The paper build target.  It depends on both reproduction outputs, so
    # `dvc repro check_paper` walks exactly the paper's chain — data, activations, probes,
    # evaluations, tables, figures — and touches nothing auxiliary.  A clean run of this
    # one stage is the answer to "does the paper still build?".
    #
    # MIND THE LOCK.  `dvc repro` deletes a stage's outputs before re-running it, so if
    # dvc.lock does not already vouch for an artifact, walking the chain will destroy and
    # rebuild it — that is how a 15,708-file activation cache got wiped once.  Artifacts
    # produced outside a completed stage are not in the DVC cache either, so the loss is
    # not recoverable by `dvc checkout`.  Before the first repro on a tree whose lock is
    # stale, adopt what is already on disk:
    #
    #     dvc commit          # stamp existing outputs into dvc.lock, running nothing
    #     dvc repro check_paper
    #
    # To verify without any chance of touching upstream stages, run the target alone:
    #
    #     dvc repro --single-item check_paper
    cmd: python scripts/reproductions/promise_of_contrast/check_paper.py
    deps:
      - scripts/reproductions/promise_of_contrast/check_paper.py
      - outputs/reproductions/promise_of_contrast/llama2_7b
      - outputs/reproductions/promise_of_contrast/llama3_8b
    outs:
      - outputs/reproductions/promise_of_contrast/CHECKS.md:
          cache: false
