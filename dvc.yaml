  report_subspace_scatter_cities_grid:
    cmd: python scripts/report_subspace_scatter.py --runs llama3_8b__cities_grid --output-name cities_grid_subspace_scatter
    deps:
      - scripts/report_subspace_scatter.py
      - src/probing/
      - src/activations/
      - data/probes/llama3_8b__cities_grid
      - data/activations/llama3_8b__cities_grid
    params:
      - models.llama3_8b
      - activations
      - output.activations_dir
      - output.probes_dir
      - output.reports_dir
      - reporting.yaml:
          - scatter
    outs:
      - outputs/reports/cities_grid_subspace_scatter.pdf:
          cache: false

  report_subspace_scatter_cities_grid_3d:
    cmd: python scripts/report_subspace_scatter.py --3d --runs llama3_8b__cities_grid --output-name cities_grid_subspace_scatter_3d
    deps:
      - scripts/report_subspace_scatter.py
      - src/probing/
      - src/activations/
      - data/probes/llama3_8b__cities_grid
      - data/activations/llama3_8b__cities_grid
    params:
      - models.llama3_8b
      - activations
      - output.activations_dir
      - output.probes_dir
      - output.reports_dir
      - reporting.yaml:
          - scatter
    outs:
      - outputs/reports/cities_grid_subspace_scatter_3d.pdf:
